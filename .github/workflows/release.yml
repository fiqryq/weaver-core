name: Release

# Tests the agent server on every pull request and push. Pushes to main refresh the rolling
# `server-latest` prerelease that install.sh and weaver-update download; tags named `v*` or
# `server-v*` get a versioned release. Each release has the Linux binaries, the setup script
# (install.sh), the helper scripts the VPS installs (weaver-bot-user, weaver-update) and SHA256SUMS
# covering all of them.
on:
  push:
    branches: [main]
    tags: ["v*", "server-v*"]
  pull_request:
  workflow_dispatch:

# One run per branch or tag at a time, so two pushes can't upload to the same release at once.
# Only pull request runs are cancelled by newer ones; release runs wait their turn.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit -p .
      - run: bun run test
      - name: Check the shell scripts
        run: |
          for script in scripts/* deploy/test/*.sh; do bash -n "$script"; done
          shellcheck scripts/* deploy/test/*.sh

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:linux-x64 && bun run build:linux-arm64
      - name: Smoke test the x64 binary
        run: |
          data="$(mktemp -d)"
          WEAVER_TOKEN=ci-smoke-test-token WEAVER_LISTEN=127.0.0.1:7799 WEAVER_DATA_DIR="$data" ./dist/weaver-server-linux-x64 &
          server=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7799/v1/health; then kill "$server"; exit 0; fi
            sleep 1
          done
          kill "$server" || true
          exit 1
      - name: Collect release files
        run: |
          mkdir release
          cp dist/weaver-server-linux-x64 dist/weaver-server-linux-arm64 scripts/install.sh scripts/weaver-bot-user scripts/weaver-update release/
          chmod 755 release/*
          cd release && sha256sum weaver-server-linux-x64 weaver-server-linux-arm64 install.sh weaver-bot-user weaver-update > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Update server-latest
        if: github.ref == 'refs/heads/main'
        run: |
          # Point the server-latest tag at this commit, creating it the first time.
          if gh api "repos/$GH_REPO/git/ref/tags/server-latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/server-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/server-latest -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Built from main at $GITHUB_SHA. Install on a VPS with: curl -fsSL https://github.com/$GH_REPO/releases/download/server-latest/install.sh | bash"
          if gh release view server-latest >/dev/null 2>&1; then
            gh release edit server-latest --prerelease --notes "$notes"
          else
            gh release create server-latest --verify-tag --prerelease --title "Agent server (latest)" --notes "$notes"
          fi
          # SHA256SUMS goes last; the setup script retries if it catches the files mid-upload.
          gh release upload server-latest --clobber \
            release/weaver-server-linux-x64 release/weaver-server-linux-arm64 release/install.sh release/weaver-bot-user release/weaver-update
          gh release upload server-latest --clobber release/SHA256SUMS
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#server-}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Agent server $version" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/weaver-server-linux-x64 release/weaver-server-linux-arm64 release/install.sh release/weaver-bot-user release/weaver-update
          gh release upload "$GITHUB_REF_NAME" --clobber release/SHA256SUMS
